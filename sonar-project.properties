# SonarQube Cloud (CI-based analysis). Check both keys against the project page after importing the repository.
sonar.organization=beratssert
sonar.projectKey=beratssert_fire-detection-network
sonar.projectName=fire-detection-network
sonar.sources=.
sonar.exclusions=poster/**,data/**,docs/img/*.png
sonar.python.version=3.12
# Enable when pytest writes coverage:  sonar.python.coverage.reportPaths=coverage.xml
